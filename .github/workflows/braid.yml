# Builds and tests Braid: the shared booster module, the Windows tray app (exe, installer,
# portable zip) and the Android APK. Download the results from the run's "Artifacts".
name: Braid

on:
  push:
    paths: ['braid/**', '.github/workflows/braid.yml']
  pull_request:
    paths: ['braid/**', '.github/workflows/braid.yml']
  workflow_dispatch:

jobs:
  go-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: braid/desktop/go.mod
          cache-dependency-path: |
            braid/desktop/go.sum
            braid/android/golib/go.sum
      - name: Booster protocol
        working-directory: braid/boost
        run: go vet ./... && go test -race ./...
      - name: Desktop (Linux build, Windows cross-build)
        working-directory: braid/desktop
        run: |
          go vet ./...
          GOOS=windows go vet ./...
          go test ./...
      - name: Android engine
        working-directory: braid/android/golib
        run: go vet ./... && go test -race ./...

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: braid/desktop/go.mod
          cache-dependency-path: braid/desktop/go.sum
      - run: choco install innosetup --no-progress -y
      - name: Build exe, installer and portable zip
        working-directory: braid/desktop
        shell: pwsh
        run: scripts/build.ps1 -Version 0.1.0 -RepoUrl "https://github.com/${{ github.repository }}"
      - name: Smoke test (virtual adapter, routes, probes)
        working-directory: braid/desktop
        shell: pwsh
        run: scripts/windows-smoke.ps1 dist\braid.exe
      - uses: actions/upload-artifact@v4
        with:
          name: braid-windows
          path: |
            braid/desktop/dist/braid-setup-*.exe
            braid/desktop/dist/braid-*-portable.zip
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: braid/android/golib/go.mod
          cache-dependency-path: braid/android/golib/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Go engine (gomobile)
        working-directory: braid/android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          ./scripts/build-go.sh
      - name: Build APKs
        working-directory: braid/android
        run: ./gradlew --no-daemon assembleDebug assembleRelease
      - name: Collect APKs
        working-directory: braid/android
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/braid-android-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/braid-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: braid-android
          path: braid/android/out/*.apk
          if-no-files-found: error

  # Publishes the latest build as a public pre-release, so the files download without a GitHub login
  # (Actions artifacts always need one). Links stay the same for every build:
  #   https://github.com/<repo>/releases/download/braid-latest/braid-android.apk
  publish:
    needs: [go-tests, windows, android]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Package
        run: |
          cd out
          ls -la
          zip -j braid-android.zip braid-android.apk
          for f in braid-setup-*.exe; do cp "$f" braid-setup.exe; done
          sha256sum braid-android.apk braid-android.zip braid-setup.exe braid-*-portable.zip > SHA256SUMS
      - name: Replace the braid-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete braid-latest --yes --cleanup-tag || true
          gh release create braid-latest --prerelease --target "$GITHUB_SHA" \
            --title "Braid (latest build)" \
            --notes "آخرین بیلد Braid. اندروید: braid-android.apk را روی گوشی نصب کنید. ویندوز: braid-setup.exe. Latest Braid build: install braid-android.apk on Android, braid-setup.exe on Windows." \
            out/braid-android.apk out/braid-android.zip out/braid-setup.exe out/braid-*-portable.zip out/SHA256SUMS
